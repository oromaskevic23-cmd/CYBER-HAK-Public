name: CYBER HAK — Private Checkout Scanner Contract
on:
  pull_request:
    paths:
      - 'src/private-checkout-audit.mjs'
      - 'tools/audit-private-checkout.mjs'
      - 'test/private-checkout-audit.test.mjs'
      - '.github/workflows/private-checkout-audit-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-plugin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies, no installation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full CYBER HAK offline regression and independent audit parser tests
        run: npm run verify
      - name: Verify static scanner parsing
        run: |
          node --check src/private-checkout-audit.mjs
          node --check tools/audit-private-checkout.mjs
