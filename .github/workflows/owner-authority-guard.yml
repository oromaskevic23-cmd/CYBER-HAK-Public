name: CYBER HAK | Owner Authority Guard — Signed Identity Tests

on:
  push:
    branches: [main]
    paths:
      - 'security/owner_authority_guard/**'
      - '.github/workflows/owner-authority-guard.yml'
  pull_request:
    paths:
      - 'security/owner_authority_guard/**'
      - '.github/workflows/owner-authority-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-authority-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned signing verifier
        run: python -m pip install -r security/owner_authority_guard/requirements.txt
      - name: Check syntax
        run: python -m compileall -q security/owner_authority_guard
      - name: Verify real Ed25519 and anti-usurpation tests
        run: python -m unittest discover -s security/owner_authority_guard/tests -p 'test_guard.py' -v
