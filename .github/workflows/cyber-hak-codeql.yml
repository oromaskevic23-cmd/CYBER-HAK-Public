name: CYBER HAK CodeQL Security Analysis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: cyber-hak-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-javascript:
    name: CodeQL JavaScript / Security and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public security code without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Initialize pinned CodeQL v4
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4 immutable
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - name: Analyze and publish public-code SARIF
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # same pinned v4
        with:
          category: /language:javascript-typescript
